<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chef AI - Portofolio Fullstack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 selection:bg-orange-200">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-orange-100 text-orange-600 mb-4 shadow-sm">
                <i class="fa-solid fa-utensils text-2xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Smart <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-amber-500">Chef AI</span></h1>
            <p class="text-slate-500 mt-3 text-lg">Sebutkan bahan di kulkasmu (atau unggah fotonya), AI akan meracik resepnya.</p>
        </div>

        <!-- Input Section -->
        <div class="glass-card rounded-2xl shadow-xl p-8 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Image Upload -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">1. Unggah Foto Bahan (Opsional)</label>
                    <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer relative overflow-hidden group" id="upload-box">
                        <input type="file" id="image-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div id="upload-placeholder">
                            <i class="fa-solid fa-camera text-3xl text-slate-400 mb-2 group-hover:text-orange-500 transition"></i>
                            <p class="text-sm text-slate-500">Klik untuk tambah foto kulkas</p>
                        </div>
                        <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-cover rounded-lg z-0" src="" alt="Preview">
                    </div>
                </div>

                <!-- Text Input -->
                <div class="flex flex-col justify-between">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">2. Ketik Bahan Makanan</label>
                        <textarea id="text-input" rows="3" class="w-full rounded-xl border border-slate-300 p-4 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition outline-none resize-none" placeholder="Contoh: ayam, nasi sisa semalam, telur, bawang merah..."></textarea>
                    </div>
                    <button id="generate-btn" class="w-full mt-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-4 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        Racik Resep Sekarang
                    </button>
                </div>
            </div>
            <div id="error-message" class="hidden mt-4 bg-red-50 text-red-600 p-4 rounded-lg text-sm font-medium flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text"></span>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="hidden flex-col items-center justify-center py-12">
            <div class="loader mb-4"></div>
            <p class="text-slate-500 font-medium animate-pulse">Menghubungi Server AI Lokal...</p>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="hidden opacity-0 transition-opacity duration-500">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                <!-- Recipe Header -->
                <div class="bg-slate-900 p-8 text-white relative overflow-hidden">
                    <div class="absolute -right-10 -top-10 opacity-10 text-9xl">
                        <i class="fa-solid fa-bowl-food"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="flex gap-3 mb-4" id="recipe-badges"></div>
                        <h2 id="recipe-title" class="text-3xl font-bold mb-2">Nama Resep</h2>
                        <p id="recipe-reason" class="text-slate-300 text-sm md:text-base max-w-2xl">Alasan kenapa resep ini cocok.</p>
                    </div>
                </div>

                <!-- Recipe Content -->
                <div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- Ingredients -->
                    <div class="md:col-span-1 bg-slate-50 p-6 rounded-xl border border-slate-100">
                        <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-basket-shopping text-orange-500"></i> Bahan-bahan
                        </h3>
                        <ul id="ingredients-list" class="space-y-3 text-slate-600"></ul>
                    </div>

                    <!-- Steps -->
                    <div class="md:col-span-2">
                        <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-fire-burner text-orange-500"></i> Cara Memasak
                        </h3>
                        <div id="steps-list" class="space-y-6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const loadingState = document.getElementById('loading-state');
        const resultContainer = document.getElementById('result-container');
        const errorMsg = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        let base64Image = null;
        let mimeType = null;

        // Preview & Convert Image
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                mimeType = file.type;
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.classList.remove('hidden');
                    base64Image = event.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        });

        // Trigger API via Local Backend
        generateBtn.addEventListener('click', async () => {
            if (!base64Image && !textInput.value.trim()) {
                showError("Masukkan bahan makanan di kolom teks terlebih dahulu!");
                return;
            }

            hideError();
            resultContainer.classList.add('hidden');
            resultContainer.classList.remove('opacity-100');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                // Tembak ke server Node.js lokal lo
                const response = await fetch('http://localhost:3000/api/generate-recipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageBase64: base64Image,
                        mimeType: mimeType,
                        textPrompt: textInput.value
                    })
                });

                const result = await response.json();

                if (!result.success) throw new Error(result.message);

                renderRecipe(result.data);

            } catch (err) {
                console.error(err);
                // Jika server mati, error handling ini akan muncul
                if (err.message === 'Failed to fetch') {
                    showError("Server Backend belum menyala. Buka terminal VS Code dan jalankan 'node server.js'.");
                } else {
                    showError("Terjadi kesalahan: " + err.message);
                }
            } finally {
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        function renderRecipe(data) {
            document.getElementById('recipe-title').innerText = data.nama_resep;
            document.getElementById('recipe-reason').innerText = data.alasan;

            let difficultyColor = data.kesulitan.toLowerCase() === 'mudah' ? 'bg-emerald-500' : (data.kesulitan.toLowerCase() === 'sedang' ? 'bg-amber-500' : 'bg-red-500');
            document.getElementById('recipe-badges').innerHTML = `
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-300 border border-slate-600 flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${data.waktu_masak}</span>
                <span class="px-3 py-1 rounded-full text-xs font-bold text-white ${difficultyColor}">${data.kesulitan}</span>
            `;

            document.getElementById('ingredients-list').innerHTML = data.bahan_lengkap.map(bahan => `
                <li class="flex items-start gap-2 border-b border-slate-200 pb-2 last:border-0"><i class="fa-solid fa-check text-orange-500 mt-1 text-sm"></i> <span>${bahan}</span></li>
            `).join('');

            document.getElementById('steps-list').innerHTML = data.langkah_masak.map((langkah, index) => `
                <div class="flex gap-4">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-sm shadow-sm">${index + 1}</div>
                    <p class="text-slate-700 pt-1 leading-relaxed">${langkah}</p>
                </div>
            `).join('');

            resultContainer.classList.remove('hidden');
            setTimeout(() => resultContainer.classList.add('opacity-100'), 50);
        }

        function showError(msg) { errorText.innerText = msg; errorMsg.classList.remove('hidden'); }
        function hideError() { errorMsg.classList.add('hidden'); }
    </script>
</body>
</html>
